name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: make qa check-install-guidance

  compatibility:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.python == '3.14' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: "3.10", guardrails: latest, sdk: latest}
          - {python: "3.10", guardrails: floor, sdk: latest}
          - {python: "3.11", guardrails: latest, sdk: latest}
          - {python: "3.12", guardrails: latest, sdk: latest}
          - {python: "3.12", guardrails: floor, sdk: latest}
          - {python: "3.13", guardrails: latest, sdk: latest}
          - {python: "3.14", guardrails: latest, sdk: latest}
          - {python: "3.10", guardrails: floor, sdk: "0.6.2"}
          - {python: "3.10", guardrails: latest, sdk: "0.6.2"}
          - {python: "3.12", guardrails: floor, sdk: "0.6.2"}
          - {python: "3.12", guardrails: latest, sdk: "0.6.2"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
      - run: python -m pip install build
      - run: |
          python scripts/compat_matrix.py --cell "${{ matrix.python }}" "${{ matrix.guardrails }}" "${{ matrix.sdk }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-${{ matrix.python }}-${{ matrix.guardrails }}-${{ matrix.sdk }}
          path: .compat-logs/*.log
          include-hidden-files: true

  installed-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: python -m pip install build
      - run: make artifact-test
