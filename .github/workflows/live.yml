name: Live Drex tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    env:
      NACE_API_KEY: ${{ secrets.NACE_API_KEY }}
    steps:
      - name: Check live test configuration
        run: |
          if [ -z "$NACE_API_KEY" ]; then
            echo "::error::NACE_API_KEY is absent. Run live tests locally or use a repository with this secret configured."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: make live
